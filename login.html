<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101914">
<title>تسجيل الدخول | AMD Floor</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  background:#f6f8f7;
  color:#15211b;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
}
.login{
  width:100%;
  max-width:430px;
}
.logo{
  width:68px;
  height:68px;
  border-radius:20px;
  background:#dfff63;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:900;
  margin:0 auto 14px;
}
.brand{
  text-align:center;
  margin-bottom:32px;
}
.brand h1{
  margin:0;
  font-size:30px;
}
.brand p{
  margin:8px 0 0;
  color:#7f8a84;
}
.card{
  background:#fff;
  border:1px solid #e5ebe7;
  border-radius:22px;
  padding:24px;
}
.card h2{
  margin:0 0 5px;
  font-size:23px;
}
.card .desc{
  color:#7f8a84;
  font-size:14px;
  margin-bottom:22px;
}
label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:15px 0 7px;
}
input{
  width:100%;
  border:1px solid #dbe2de;
  border-radius:12px;
  padding:14px;
  font:inherit;
  outline:none;
  background:#fff;
}
input:focus{
  border-color:#101914;
}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:20px;
  background:#101914;
  color:#fff;
  font:inherit;
  font-weight:800;
  cursor:pointer;
}
.note{
  text-align:center;
  color:#7f8a84;
  font-size:12px;
  margin-top:18px;
}
.error{
  display:none;
  background:#fff1f1;
  color:#a73535;
  padding:11px;
  border-radius:10px;
  font-size:13px;
  margin-top:14px;
}
</style>
</head>

<body>

<div class="login">

  <div class="brand">
    <div class="logo">A</div>
    <h1>AMD Floor</h1>
    <p>إدارة مطعمك أو كوفيّك من مكان واحد</p>
  </div>

  <div class="card">
    <h2>تسجيل الدخول</h2>
    <div class="desc">أدخل بيانات حسابك للوصول إلى لوحة التحكم</div>

    <form id="loginForm">

      <label>البريد الإلكتروني</label>
      <input
        id="email"
        type="email"
        placeholder="name@example.com"
        required
      >

      <label>كلمة المرور</label>
      <input
        id="password"
        type="password"
        placeholder="••••••••"
        required
      >

      <div class="error" id="error">
        تأكد من البريد الإلكتروني وكلمة المرور
      </div>

      <button type="submit">تسجيل الدخول</button>

    </form>
  </div>

  <div class="note">
    AMD Floor — نظام إدارة المطاعم والكوفيهات
  </div>

</div>

<script>
const loginForm=document.getElementById("loginForm");

loginForm.onsubmit=function(e){
  e.preventDefault();

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(email && password){
    localStorage.setItem("amdFloorLoggedIn","true");
    localStorage.setItem("amdFloorUser",email);
    window.location.href="index.html";
  }else{
    document.getElementById("error").style.display="block";
  }
};
</script>

</body>
</html>
