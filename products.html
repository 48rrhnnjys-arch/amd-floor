<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المنتجات - AMD Floor</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f6f8f7;
      color: #17211c;
    }

    header {
      background: #111915;
      color: white;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    .logout-btn {
      background: #ffffff;
      color: #111915;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    main {
      width: min(1100px, 94%);
      margin: 30px auto;
    }

    .top {
      margin-bottom: 22px;
    }

    .top h2 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .top p {
      color: #66736c;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #e2e8e4;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }

    .product-card h3 {
      margin-bottom: 14px;
      font-size: 20px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: #56625c;
    }

    .price {
      font-weight: bold;
      color: #111915;
    }

    .empty {
      background: white;
      border-radius: 16px;
      padding: 35px;
      text-align: center;
      color: #777;
      border: 1px solid #e2e8e4;
    }

    .error {
      color: #b42318;
      background: #fff1f0;
      padding: 16px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>AMD Floor</h1>
  <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
</header>

<main>

  <div class="top">
    <h2>المنتجات</h2>
    <p>عرض المنتجات والمخزون المسجل في النظام</p>
  </div>

  <div id="products" class="products-grid">
    <div class="empty">جاري تحميل المنتجات...</div>
  </div>

</main>

<script>
  const SUPABASE_URL = "https://qxgundqtkhkbrcvvhghv.supabase.co";

  const SUPABASE_KEY = "sb_publishable_OnIvEw07Fn7YDWyBHkiIgg_0Bz3CcEs";
  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  async function loadProducts() {
    const container = document.getElementById("products");

    const {
      data: { session }
    } = await client.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return;
    }

    const { data, error } = await client
      .from("products")
      .select("*")
      .order("id", { ascending: true });

    if (error) {
      console.error(error);

      container.innerHTML = `
        <div class="error">
          حدث خطأ أثناء تحميل المنتجات
        </div>
      `;

      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = `
        <div class="empty">
          لا توجد منتجات حالياً
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    data.forEach(product => {
      const card = document.createElement("div");

      card.className = "product-card";

      card.innerHTML = `
        <h3>${product.name ?? "بدون اسم"}</h3>

        <div class="info">
          <span>السعر</span>
          <span class="price">
            ${product.price ?? 0} ر.س
          </span>
        </div>

        <div class="info">
          <span>الكمية بالمخزون</span>
          <span>
            ${product.stock_quantity ?? 0}
          </span>
        </div>
      `;

      container.appendChild(card);
    });
  }

  async function logout() {
    await client.auth.signOut();
    window.location.href = "login.html";
  }

  loadProducts();
</script>

</body>
</html>
